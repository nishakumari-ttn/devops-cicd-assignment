name: Deploy Website to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: my-devops-cicd-assignment-2026-3732

jobs:
  deploy:
    name: Test, package, and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files are present"

      - name: Build / Package website
        run: |
          mkdir -p dist
          cp index.html style.css script.js dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          echo "Deploying to s3://${S3_BUCKET} in ${AWS_REGION}"
          if ! aws s3 ls "s3://${S3_BUCKET}" --region "${AWS_REGION}"; then
            echo "::error::IAM user cannot access bucket ${S3_BUCKET}. In AWS IAM, open user github-actions-s3-deploy → Add permissions → Attach policies directly → AmazonS3FullAccess."
            exit 1
          fi
          aws s3 sync dist/ "s3://${S3_BUCKET}" --region "${AWS_REGION}" --delete
          echo "Deploy finished"
